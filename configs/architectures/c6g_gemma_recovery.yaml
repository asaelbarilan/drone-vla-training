# C6G - C3G plus event-triggered recovery.
#
# Selective invocation is far more valuable with a real model than with a
# simulated one, because the reasoner call now costs real seconds. This is the
# configuration where the compute argument should show up most clearly.

_base_: [c6_triggered_recovery.yaml, ../models/gemma3_4b.yaml]

id: c6g

family: selective_recovery
# Ablation of C6: scripted stand-in -> real VLM.
ablation_of: c6
name: "C6 with Gemma 3 4B vision"
tags: [real_model, vision, gemma]

perception:
  # Off: this plugin runs no model, so charging it against a real backend would
  # send an empty prompt to Gemma and wait seconds for an unread reply.
  name: identity
  params:
    charge_latency: false

policy:
  name: vlm_point_waypoint
  params:
    model_id: gemma3:4b
    hop_m: 12.0
    arrival_hop_m: 4.0
    min_altitude_m: 2.0

staleness:
  # Raised from the 1.5 s default, and this is a *measured accommodation*, not a
  # free parameter. Gemma 3 4B takes seconds per frame on this hardware, so the
  # bound designed for a fast policy would reject every decision it produced.
  # The gap between the two numbers is itself a finding about whether a model
  # this size can hold waypoint authority in a real-time loop.
  max_decision_age_s: 8.0
  reject_stale: true
