# PRIVILEGED DIAGNOSTIC - NOT A REPORTABLE ARCHITECTURE.
# Combines the two diagnostics: c0's winning route described in words (simulator
# truth) AND the five-word steering output contract. This is the most favourable
# condition the decision agent can be given - it is told exactly where to go and
# is asked for a word rather than a pixel.
#
# Acceptance is NOT mission success. It is whether the commanded bearings spread
# beyond +-10 degrees, i.e. whether the agent acts on a stated direction at all.
# Under the pixel contract with the same route it did not: median u was exactly
# 112 on an image whose centre is 112. See D-66.

_base_: c5_onfly_qwen4_direction_dev.yaml

id: c5_route_direction_s1061
profile_of: c5
name: "C5 OnFly + spoken route + direction words (privileged diagnostic, seed 1061)"
description: "Capability floor probe with both the route and a verbal output channel."
tags: [onfly, development, privileged_diagnostic, route_hint, discrete_direction, qwen3_vl_4b]

policy:
