# Full OnFly at the paper-reported motion envelope with the strongest already
# validated local Qwen3-VL backend. This remains a compatible backend profile:
# the paper uses Qwen3-VL-4B-AWQ, while this test uses Qwen3-VL 8B Q4_K_M.

_base_: c5_onfly_qwen.yaml

id: c5_onfly_qwen_native_dynamics
profile_of: c5
name: "Full OnFly + Qwen3-VL 8B, paper-native dynamics"
description: "C5 OnFly compatible-backend validation at 0.6 m/s and 0.4 rad/s yaw."
tags: [onfly, full_architecture, native_dynamics_profile, real_model, qwen3_vl_8b]

controller:
  params:
    max_yaw_rate_rps: 0.4

planner:
  params:
    max_acc_mps2: 0.6

monitor:
  params:
    lost_yaw_rate_rps: 0.4
