# Development-only. Same discrete-direction output contract as
# c5_onfly_qwen4_direction_dev, with Gemma 3 4B in place of Qwen3-VL 4B.
#
# Reason for the swap: Qwen3-VL 4B routes every response through Ollama's
# `thinking` channel even with think:false, which is a known open issue for this
# backend, and it used only 3 of the 5 direction words on seed 1060. Gemma 3 4B
# answers on the normal channel. If both models saturate at `ahead`, the
# capability finding holds across two models AND two output representations.

_base_: c5_onfly_qwen4_direction_dev.yaml

id: c5_onfly_gemma4b_direction_dev
profile_of: c5
name: "C5 OnFly + Gemma 3 4B, discrete direction output (development)"
description: "Seed-1060 output-contract experiment on the second local VLM."
tags: [onfly, development, discrete_direction, real_model, gemma3_4b]

policy:
  params:
    model_id: gemma3:4b

monitor:
  params:
    model_id: gemma3:4b
