# D-101: frozen C5 shared execution, new adaptive-plan/SPF semantic interface.
# Full snapshot avoids inherited OnFly-only parameters silently misdescribing this policy.
# Test compares shared components with c5_gemma_guarded_monitor_dev.
# Use grid_nav_onfly_depth_v2_dev. No autonomous improvement established.
id: vlm_adaptive_plan_gemma_dev
name: VLM-authored adaptive plan + SPF waypoints (Gemma development)
description: Model authors subgoals/order/points; MapGPT planning component plus SPF
  projection.
family: hybrid_stack
profile_of: c5
authority: waypoint
chunk_length: 1
semantic_supervision: periodic_monitor
semantic_memory: compact_keyframe_memory
memory_consumers:
- monitor
perception:
  name: identity
  params:
    min_score: 0.0
    drone_radius_m: 0.4
    charge_latency: false
memory:
  name: onfly_hybrid_memory
  params:
    window: 5
    capacity: 6
    min_separation_m: 3.0
    keyframe_budget: 4
    translation_threshold_m: 2.0
    rotation_threshold_rad: 0.3490658504
    dedupe_epsilon: 0.08
    dedupe_distance_m: 3.0
policy:
  name: adaptive_visual_plan
  params:
    model_id: gemma4:e2b
    scale_m: 7.0
    exponent: 1.8
    camera_pitch_rad: -0.15
    waypoint_tolerance_m: 0.35
    history_limit: 12
    self_terminate: false
verifier:
  name: semantic_geometric
  params:
    max_waypoint_distance_m: 10.0
    min_clearance_m: 1.8
    repair: false
    sensing_horizon_m: 25.0
    require_semantic_support: false
planner:
  name: super_local
  params:
    resolution_m: 0.5
    planning_horizon_m: 16.0
    commit_horizon_m: 2.5
    sensing_horizon_m: 25.0
    temporal_window_s: 12.0
    clearance_margin_m: 1.2
    max_acc_mps2: 0.6
monitor:
  name: onfly_monitor
  params:
    stop_confirmations: 2
    lost_after_s: 8.0
    model_id: gemma4:e2b
    layout: history_sheet_plus_latest
    structured_evidence: true
    acquisition_confirmations: 2
    stop_max_depth_m: 2.0
    lost_hold_s: 0.25
    lost_reorient_s: 2.0
    lost_yaw_rate_rps: 0.4
    target_bound_stop: true
    target_consistency_m: 1.0
    camera_pitch_rad: -0.15
    current_grounding: true
    semantic_color_guard: true
controller:
  name: mock_velocity
  params:
    kp: 1.1
    lookahead_m: 3.0
    max_speed_mps: 5.0
    yaw_kp: 1.5
    max_yaw_rate_rps: 0.4
inference:
  name: ollama
  params:
    model_id: gemma4:e2b
    host: http://localhost:11434
    expected_digest: 6fbe8a5f242b4bf980850341db5efac369ad2b0d142fde673d7e0fe2a911c8aa
    temperature: 0.0
    num_predict: 768
    num_ctx: 8192
    sampling_seed: 0
    timeout_s: 180.0
    endpoint: chat
    keep_alive: 30m
    think: false
    response_channel: content
    charge_mode: fixed
    fixed_latency_s:
      policy: 1.0
      monitor: 1.2
scheduler:
  kind: async_multi_rate
  control_hz: 20.0
  decision_hz: 2.0
  monitor_hz: 0.5
  cooldown_s: 2.0
  trigger_check_hz: 5.0
staleness:
  max_decision_age_s: 4.0
  reject_stale: true
feature_cache:
  enabled: false
  capacity: 32
allow_privileged_observations: false
unsafe_ablation: false
tags:
- development
- real_model
- vision
- adaptive_plan
- spf
- component_adaptation
