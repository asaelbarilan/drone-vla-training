# C2G - C2 with a real VLM.
#
# Same authority, same planner, same controller, same rates as C2. The scripted
# `vlm_waypoint` is replaced by `vlm_point_waypoint`, which shows Gemma 3 4B the
# camera frame and asks it to point at the target; the pixel is unprojected to a
# waypoint by tested geometry rather than by the model.
#
# This is the first configuration in the repository whose behaviour depends on a
# model actually seeing something.

_base_: [c2_vlm_waypoint.yaml, ../models/gemma3_4b.yaml]

id: c2g

family: vlm_semantic_waypointer
# Ablation of C2: scripted stand-in -> real VLM.
ablation_of: c2
name: "C2 with Gemma 3 4B vision"
tags: [real_model, vision, gemma]

perception:
  # Off: this plugin runs no model, so charging it against a real backend would
  # send an empty prompt to Gemma and wait seconds for an unread reply.
  name: identity
  params:
    charge_latency: false

policy:
  name: vlm_point_waypoint
  params:
    model_id: gemma3:4b
    hop_m: 12.0
    arrival_hop_m: 4.0
    min_altitude_m: 2.0

staleness:
  # Raised from the 1.5 s default, and this is a *measured accommodation*, not a
  # free parameter. Gemma 3 4B takes seconds per frame on this hardware, so the
  # bound designed for a fast policy would reject every decision it produced.
  # The gap between the two numbers is itself a finding about whether a model
  # this size can hold waypoint authority in a real-time loop.
  max_decision_age_s: 8.0
  reject_stale: true
