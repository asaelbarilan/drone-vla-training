# Local OnFly model profile. Qwen3-VL's native relative-coordinate convention
# is made explicit and converted to calibrated image pixels inside the policy.

_base_: qwen3_vl_8b_spf.yaml

perception:
  name: identity
  params:
    # RGB-D is consumed directly by the two OnFly agents. Charging a separate
    # text-only "perception" model call double-counts compute and changes rate.
    charge_latency: false

policy:
  name: onfly_decision
  params:
    model_id: qwen3-vl:8b
    coordinate_contract: qwen_relative_1000
    max_depth_m: 7.0
    sigma_theta: 0.65
    # Paper equation (3): lift the gated depth directly; no extra standoff.
    goal_standoff_m: 0.0
    camera_pitch_rad: -0.15
    self_terminate: false
    use_memory: false

inference:
  params:
    num_predict: 48
    fixed_latency_s:
      policy: 1.0
      monitor: 1.2

staleness:
  max_decision_age_s: 4.0
  reject_stale: true
