# grid_nav with the camera switched on.
#
# Identical scene generation, sensing model, success criteria and constraints to
# `grid_nav` - the ONLY difference is that frames are rendered. That keeps a
# real-VLM run comparable against the scripted baselines on the same scenes.
#
# The horizon is shorter because a real model costs real seconds per decision
# and the simulation clock now advances with it.

_base_: grid_nav.yaml

id: grid_nav_vision
max_episode_s: 60.0

params:
  render: true
  image_size: 224
  camera_pitch_rad: -0.15
